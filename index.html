<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/ticketfest-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TicketFest</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ticketfest:theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
